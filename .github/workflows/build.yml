name: Build APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation des dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            build-essential libffi-dev libssl-dev \
            autoconf automake libtool libtool-bin \
            zlib1g-dev pkg-config python3-pip

      - name: Installation de Buildozer et Cython
        run: pip3 install buildozer cython

      - name: Cache Buildozer (SDK/NDK Android)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Acceptation automatique des licences Android SDK
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          printf '\n8933bad161af4408943e6c3e4f5b7d4755caa3e4\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee' \
            > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd' \
            > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

      - name: Build APK (debug)
        run: yes | buildozer -v android debug

      - name: Upload de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: crypyte-pwdgen-apk
          path: bin/*.apk
          retention-days: 30
