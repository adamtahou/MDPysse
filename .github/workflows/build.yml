name: Build APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation des dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            build-essential libffi-dev libssl-dev \
            autoconf automake libtool libtool-bin \
            zlib1g-dev pkg-config python3-pip

      - name: Installation de Buildozer et Cython
        run: pip3 install buildozer cython

      - name: Cache Buildozer (SDK/NDK Android)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Installation des Android command-line tools et acceptation des licences
        run: |
          SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK_ROOT/cmdline-tools

          # Téléchargement des outils Android (sdkmanager)
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools $SDK_ROOT/cmdline-tools/latest

          # Acceptation de toutes les licences
          yes | $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$SDK_ROOT --licenses

          # Installation des composants SDK nécessaires
          $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$SDK_ROOT \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          # Symlink vers l'ancien chemin que python-for-android cherche
          mkdir -p $SDK_ROOT/tools/bin
          ln -sf $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            $SDK_ROOT/tools/bin/sdkmanager

      - name: Build APK (debug)
        run: buildozer -v android debug

      - name: Upload de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: crypyte-pwdgen-apk
          path: bin/*.apk
          retention-days: 30
